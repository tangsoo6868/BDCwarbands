<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Black Death City Warbands</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Alegreya+Sans+SC:wght@500;700&family=Pirata+One&display=swap">
<style>
/* Layout: sticky ledger bar on top; roster column left, fighter sheet right; stacks to one column on phones. */
:root {
  --bg: #e9ece7; --surface: #ffffff; --surface-2: #f3f5f1; --ink: #121615; --muted: #46504c; --line: #bcc5c0; --line-strong: #7d8a84;
  --accent: #1b6655; --accent-ink: #ffffff; --accent-soft: #d6ebe4;
  --bad: #a1241a; --bad-soft: #f8dfdb; --warn: #7a4f00; --warn-soft: #f6e8c8; --good: #1f6a2c; --good-soft: #dcefdc;
  --coin: #5b5f63;
  --f-display: 'Pirata One', 'UnifrakturCook', Georgia, serif;
  --f-body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --f-label: 'Alegreya Sans SC', 'Alegreya Sans', system-ui, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101413; --surface: #191e1d; --surface-2: #212826; --ink: #eef2ee; --muted: #b0bbb6; --line: #34403c; --line-strong: #5c6b65;
  --accent: #63c9ae; --accent-ink: #08201a; --accent-soft: #173a31;
  --bad: #ff8b7c; --bad-soft: #3d1a16; --warn: #f2bd57; --warn-soft: #3a2c0f; --good: #7fd88e; --good-soft: #163019;
  --coin: #c4c9cc; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101413; --surface: #191e1d; --surface-2: #212826; --ink: #eef2ee; --muted: #b0bbb6; --line: #34403c; --line-strong: #5c6b65;
  --accent: #63c9ae; --accent-ink: #08201a; --accent-soft: #173a31;
  --bad: #ff8b7c; --bad-soft: #3d1a16; --warn: #f2bd57; --warn-soft: #3a2c0f; --good: #7fd88e; --good-soft: #163019;
  --coin: #c4c9cc; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }

/* Ledger bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 2px solid var(--line-strong); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-size: 1.7rem; line-height: 1; color: var(--ink); margin-right: auto; display: flex; flex-direction: column; min-width: 0; }
.brand small { font-family: var(--f-body); font-size: .85rem; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.tally { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.tal { display: flex; flex-direction: column; min-width: 70px; }
.tal b { font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tal span { font-family: var(--f-label); font-size: .82rem; letter-spacing: .04em; color: var(--muted); }
.tal.bad b { color: var(--bad); }
.status { border: 2px solid currentColor; border-radius: 999px; padding: 6px 14px; font-weight: 700; background: none; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; min-height: 44px; }
.status.ok { color: var(--good); }
.status.no { color: var(--bad); }
.status.todo { color: var(--warn); }

/* Tabs */
.tabs { display: flex; gap: 4px; padding-top: 14px; border-bottom: 2px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 16px; font-weight: 700; font-size: 1.02rem; color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; cursor: pointer; white-space: nowrap; min-height: 44px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 18px 60px; }
.grid { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } .grid.detail-open .col-roster { display: none; } .grid:not(.detail-open) .col-detail { display: none; } }
@media (min-width: 881px) { .back-btn { display: none !important; } .col-roster { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh, 150px) + 12px); max-height: calc(100vh - var(--barh, 150px) - 24px); overflow-y: auto; padding-right: 4px; } }
.sm { display: none; }
@media (max-width: 880px) { .tal b { font-size: 1.25rem; } .brand { font-size: 1.45rem; } }
@media (max-width: 600px) {
  .lg { display: none; } .sm { display: inline; }
  .bar .wrap { flex-wrap: nowrap; gap: 8px; padding-block: 8px; }
  .brand { display: none; }
  .tally { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .tal { min-width: 0; }
  .tal b { font-size: 1.15rem; }
  .tal span { font-size: .74rem; letter-spacing: .02em; }
  .status { padding: 4px 10px; font-size: .9rem; min-height: 40px; white-space: nowrap; flex: none; }
  .tab { padding: 10px 8px; font-size: .95rem; }
  .tabs { gap: 0; padding-top: 8px; }
}
@media (max-width: 520px) { table.stats { min-width: 0; } table.stats td { font-size: 1.25rem; } table.stats th { font-size: .74rem; letter-spacing: 0; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.lbl { font-family: var(--f-label); font-size: .9rem; letter-spacing: .05em; color: var(--muted); display: block; margin-bottom: 4px; }
.hint { color: var(--muted); font-size: .92rem; }
input[type=text], input[type=number], select, textarea { width: 100%; min-height: 44px; padding: 8px 10px; border: 2px solid var(--line-strong); border-radius: var(--r); background: var(--surface); }
select { cursor: pointer; }
textarea { min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: var(--r); border: 2px solid var(--line-strong); background: var(--surface); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: .95rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Roster list */
.group h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.group h3 .cnt { font-family: var(--f-body); font-size: .95rem; font-weight: 700; color: var(--muted); }
.group h3 .cnt.bad { color: var(--bad); }
.fl { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fbtn { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 12px; border: 2px solid var(--line); border-radius: var(--r); background: var(--surface-2); cursor: pointer; min-height: 52px; }
.fbtn:hover { border-color: var(--line-strong); }
.fbtn[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fbtn .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbtn .sub { grid-column: 1; font-size: .88rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbtn .cost { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.fbtn .flag { color: var(--bad); font-weight: 800; }
.empty { border: 2px dashed var(--line); border-radius: var(--r); padding: 10px 12px; color: var(--muted); font-size: .92rem; }

/* Issues */
.issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.issue { padding: 8px 12px; border-radius: var(--r); font-size: .95rem; display: flex; gap: 8px; align-items: baseline; }
.issue.error { background: var(--bad-soft); color: var(--bad); }
.issue.warn { background: var(--warn-soft); color: var(--warn); }
.issue .tag { font-family: var(--f-label); font-weight: 700; letter-spacing: .05em; flex: none; }
.issue button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font-weight: 700; text-align: left; }
.allgood { background: var(--good-soft); color: var(--good); padding: 10px 12px; border-radius: var(--r); font-weight: 700; }

/* Fighter sheet */
.sheet-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
.sheet-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 2.1rem; line-height: 1.05; }
.kw { color: var(--muted); font-style: italic; }
.price { text-align: right; }
.price b { font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; display: block; line-height: 1; }
.price span { font-size: .9rem; color: var(--muted); }
.stats-wrap { overflow-x: auto; }
table.stats { border-collapse: collapse; width: 100%; min-width: 440px; text-align: center; font-variant-numeric: tabular-nums; }
table.stats th { font-family: var(--f-label); font-weight: 700; font-size: .88rem; letter-spacing: .04em; color: var(--muted); padding: 4px 2px; border-bottom: 2px solid var(--line-strong); }
table.stats td { font-size: 1.6rem; font-weight: 800; padding: 6px 2px; }
table.stats td.mod { color: var(--accent); }
.sec h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec h3 small { font-family: var(--f-body); font-size: .95rem; color: var(--muted); font-weight: 500; }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
@media (max-width: 560px) { .slots { grid-template-columns: minmax(0, 1fr); } }
.locked { min-height: 44px; display: flex; align-items: center; padding: 8px 10px; border: 2px dashed var(--line-strong); border-radius: var(--r); background: var(--surface-2); font-weight: 700; }
.tbl-wrap { overflow-x: auto; }
table.wp { border-collapse: collapse; width: 100%; min-width: 560px; font-variant-numeric: tabular-nums; }
table.wp th { text-align: left; font-family: var(--f-label); font-size: .85rem; letter-spacing: .04em; color: var(--muted); border-bottom: 2px solid var(--line-strong); padding: 6px 8px; }
table.wp td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.wp td.n { text-align: center; font-weight: 700; }
.trait { display: inline-block; font-size: .85rem; padding: 1px 7px; border: 1px solid var(--line-strong); border-radius: 999px; margin: 1px 3px 1px 0; white-space: nowrap; cursor: help; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rules li b { display: inline; }
.picks { display: flex; flex-direction: column; gap: 14px; }
.picks h4 { margin: 0 0 6px; font-size: 1rem; font-family: var(--f-label); letter-spacing: .04em; }
.picks h4 span { font-family: var(--f-body); font-weight: 400; color: var(--muted); letter-spacing: 0; }
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; padding: 10px; border: 2px solid var(--line); border-radius: var(--r); cursor: pointer; align-items: start; }
.opt + .opt { margin-top: 6px; }
.opt input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); }
.opt b { font-weight: 700; }
.opt .t { grid-column: 2; font-size: .93rem; color: var(--muted); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt.off { opacity: .5; cursor: not-allowed; }
.cv { font-weight: 700; font-variant-numeric: tabular-nums; }
.xp { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.xp input { width: 90px; }
.xp .tot { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.note { padding: 10px 12px; border-left: 4px solid var(--accent); background: var(--surface-2); border-radius: 0 var(--r) var(--r) 0; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-radius: var(--r); background: var(--bad-soft); color: var(--bad); font-weight: 700; }

/* Recruit list */
.rec-group h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; margin: 6px 0; }
.rec { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rec .nm { font-weight: 700; }
.rec .sub { grid-column: 1; font-size: .9rem; color: var(--muted); }
.rec .c { grid-row: 1 / span 2; grid-column: 2; font-weight: 800; font-variant-numeric: tabular-nums; }
.rec .btn { grid-row: 1 / span 2; grid-column: 3; }
.rec .why { grid-column: 1 / -1; font-size: .88rem; color: var(--warn); }

/* Cards for faction/origin choice */
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.choice { text-align: left; padding: 14px; border: 2px solid var(--line); border-radius: var(--r); background: var(--surface-2); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.choice b { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; line-height: 1.1; }
.choice span { color: var(--muted); font-size: .93rem; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* Roster sheet view */
.sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; line-height: 1.1; display: flex; justify-content: space-between; gap: 8px; }
.card h3 span { font-family: var(--f-body); font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.card .mini { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; border: 1px solid var(--line); border-radius: var(--r); font-variant-numeric: tabular-nums; }
.card .mini div { padding: 4px 0; }
.card .mini small { display: block; font-family: var(--f-label); font-size: .72rem; color: var(--muted); }
.card .mini b { font-size: 1.1rem; }
.card dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: .95rem; }
.card dt { font-family: var(--f-label); color: var(--muted); }
.card dd { margin: 0; }
.wblist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.wbitem { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 14px; border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); }
.wbitem.cur { border-color: var(--accent); }
.wbitem b { font-size: 1.1rem; }
.banner { padding: 12px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-weight: 600; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .fbtn, .opt, .choice { transition: border-color .12s, background-color .12s; } }
.cs h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; margin-bottom: 8px; }
.cs-cols { columns: 2 420px; column-gap: 16px; }
.cs-cols .cs { break-inside: avoid; margin-bottom: 16px; }
.csl { margin: 0; display: grid; grid-template-columns: minmax(80px, 30%) minmax(0, 1fr); gap: 6px 14px; font-size: .97rem; }
.csl dt { font-weight: 700; }
.csl dd { margin: 0; }
table.cst { min-width: 0; margin-top: 10px; font-size: .95rem; }
table.cst td.k { font-weight: 700; white-space: nowrap; }
.cs .tbl-wrap table.cst { min-width: 520px; }
@media (max-width: 520px) {
  .stats-wrap table.stats { min-width: 0; table-layout: fixed; }
  .stats-wrap table.stats td { font-size: 1.2rem; padding: 6px 0; }
  .stats-wrap table.stats th { font-size: .7rem; letter-spacing: 0; padding: 4px 0; }
  .sheet-head h2 { font-size: 1.8rem; }
}
.sharelink { padding: 10px 12px; border: 2px dashed var(--line-strong); border-radius: var(--r); background: var(--surface-2); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; overflow-wrap: anywhere; user-select: all; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>
// Black Death City Playtest 1.03 data, transcribed from the rulebook.
const M = (name, a, r, d, c, traits, cost, extra) => Object.assign({ name, cat: 'melee', a, r, d, c, traits: traits ? traits.split(', ') : [], cost }, extra || {});
const R = (name, rng, a, r, d, c, traits, cost, extra) => Object.assign({ name, cat: 'ranged', rng, a, r, d, c, traits: traits ? traits.split(', ') : [], cost }, extra || {});
const A = (name, sv, cost, text, extra) => Object.assign({ name, cat: 'armour', sv, cost, text: text || '' }, extra || {});
const I = (name, cost, text, extra) => Object.assign({ name, cat: 'item', cost, text }, extra || {});

const BANNER_TEXT = 'While this fighter is on the battlefield, you can re-roll flee tests. You can re-roll Willpower tests made by friendly fighters while they are within 12" of this fighter and this fighter is visible to them.';
const COMMON = {
  arcane_staff: M('Arcane Staff', 2, '-', 1, 'd3', 'Arcane, Off-hand', 10),
  axe: M('Axe', 3, '-1', 1, 'd3', 'Off-hand', 16),
  club: M('Club/Mace/Hammer', 3, '-', 1, 'd3', 'Bludgeon, Off-hand', 14),
  dagger: M('Dagger', 3, '-', 1, 'd3', 'Off-hand', 10),
  ensorcelled_weapon: M('Ensorcelled Weapon', 3, '-1', 1, 'd3', 'Arcane', 26),
  flail: M('Flail', 3, '-', 1, 'd3', 'Off-hand, Wrap', 14),
  halberd: M('Halberd', 3, '-1', 1, 'd3+1', 'Brace, Two-handed, Unwieldy', 34),
  heavy_axe: M('Heavy Axe', 3, '-2', 2, 'd3+1', 'Two-handed, Unwieldy', 40),
  spear: M('Spear', 3, '-', 1, 'd3', 'Brace, Two-handed', 16),
  sword: M('Sword', 3, '-', 1, 'd3', 'Guard, Off-hand', 18),
  ogre_blade: M('Ogre Blade', 3, '-1', 2, 'd3+1', 'Off-hand', 36),
  ogre_great_weapon: M('Ogre Great Weapon', 3, '-2', 3, 'd3+2', 'Two-handed, Unwieldy', 50),
  ogre_mace: M('Ogre Mace', 3, '-1', 2, 'd3+1', 'Bludgeon, Off-hand', 38),
  cuirass: A('Cuirass', 5, 20),
  full_plate: A('Full-plate', 4, 40, 'Cannot be equipped with two-handed ranged weapons, except a Brace of Pistols.'),
  warded_robes: A('Warded Robes', 6, 10, 'Each time this fighter is targeted by an enemy spell, roll a dice. On a 4+ the spell has no effect on them.'),
  shield: I('Shield', 10, "Improve this fighter's Armour value by 1, to a maximum of 2+.", { held: true }),
  grimoire: I('Grimoire', 15, 'Once per battle, after this fighter has made a casting roll, you can re-roll the casting roll.', { rare: 1 }),
  grappling_hook: I('Grappling Hook', 5, 'This fighter can climb high walls in the same manner as ladders.', { rare: 2 }),
  ensorcelled_bell: I('Ensorcelled Bell', 10, 'Once per battle, you can re-roll a miscast roll made for this fighter.', { rare: 1 }),
};
const pick = (...ids) => Object.fromEntries(ids.map(id => [id, COMMON[id]]));

const RECITE = { name: 'Recite Holy Litanies [Action]', text: 'Once per battle. Pick a visible enemy Wizard, Priest, Demon or Undead within 12". Each player rolls a dice and adds their fighter\'s Willpower. If this fighter\'s total is equal or higher, the target suffers d3 damage.' };

}

// ---------- Derived values ----------
function gearItems(f, x) { return SLOTS.map(([k]) => x.gear[k]).filter(Boolean).map(id => ({ id, ...f.items[id] })); }
function fighterCost(f, x) {
  const d = fdef(f, x.fid); const fixed = new Set(d.fixed || []);
  let c = d.cost; const seenFixed = new Set();
  SLOTS.forEach(([k]) => { const id = x.gear[k]; if (!id) return; if (fixed.has(id) && !seenFixed.has(id)) { seenFixed.add(id); return; } c += f.items[id].cost; });
  if (x.opt && d.options) { const o = d.options.list.find(o => o.id === x.opt); if (o) c += o.cost; }
  return c;
}
const fighterXp = x => (+x.xpBase || 0) + (+x.xpRoll || 0);
function effStats(f, x) {
  const d = fdef(f, x.fid); const s = { ...d.s }; const mod = {};
  if (x.opt && d.options) { const o = d.options.list.find(o => o.id === x.opt); if (o && o.set) Object.entries(o.set).forEach(([k, v]) => { s[k] = v; mod[k] = 1; }); }
  const its = gearItems(f, x);
  const arm = its.find(i => i.cat === 'armour');
  if (arm) { if (arm.sv < s.ar) { s.ar = arm.sv; mod.ar = 1; } if (arm.moveMod && typeof s.mv === 'number') { s.mv += arm.moveMod; mod.mv = 1; } }
  if (its.some(i => i.id === 'shield')) { s.ar = Math.max(2, s.ar - 1); mod.ar = 1; }
  return { s, mod };
}
function displayName(f, x) { return x.name.trim() || fdef(f, x.fid).name; }
function allowedItems(f, d) {
  const ids = new Set(); d.lists.forEach(l => f.lists[l].items.forEach(i => ids.add(i))); return [...ids];
}
function eligibleTables(f, d) {
  const kws = kwList(d);
  const t = f.skillTables.filter(tb => tb.kw.every(k => kws.includes(k)) && (!tb.types || tb.types.includes(d.type)));
  return [...t, VETERAN];
}
function fighterLimit(f, wb, d) {
  const o = f.origins[wb.origin] || {};
  if ((o.unlimited || []).includes(d.id)) return null;
  if (o.limits && o.limits[d.id]) return o.limits[d.id];
  return d.max || null;
}
function countsAs(f, wb, d) { const o = f.origins[wb.origin] || {}; return (o.notBeast || []).includes(d.id) ? null : d.type; }

function totals(wb) {
  const f = fac(wb.faction);
  const cost = wb.fighters.reduce((a, x) => a + fighterCost(f, x), 0);
  const xp = wb.fighters.reduce((a, x) => a + fighterXp(x), 0);
  return { cost, left: BUDGET - cost, rating: cost + xp, count: wb.fighters.length };
}

// ---------- Rules check ----------
function check(wb) {
  const f = fac(wb.faction); const out = []; const per = {};
  const push = (level, msg, x) => { out.push({ level, msg, uid: x && x.uid }); if (x) (per[x.uid] = per[x.uid] || []).push({ level, msg }); };
  const t = totals(wb);
  if (t.left < 0) push('error', `Over budget by ${-t.left} silver. You start with ${BUDGET}.`);
  if (t.count > MAX_FIGHTERS) push('error', `${t.count} fighters. A warband can never exceed ${MAX_FIGHTERS}.`);
  const byType = {}; TYPES.forEach(ty => byType[ty.key] = 0);
  wb.fighters.forEach(x => { const d = fdef(f, x.fid); const c = countsAs(f, wb, d); if (c) byType[c]++; });
  if (byType.Leader === 0) push('error', 'Recruit 1 Leader.');
  if (byType.Leader > 1) push('error', `Only 1 Leader allowed (you have ${byType.Leader}).`);
  if (byType.Champion > 3) push('error', `Up to 3 Champions allowed (you have ${byType.Champion}).`);
  if (byType.Henchman < 5) push('warn', `Recruit at least 5 Henchmen (you have ${byType.Henchman}).`);
  if (byType.Brute > 2) push('error', `Up to 2 Brutes allowed (you have ${byType.Brute}).`);
  if (byType.Beast > 3) push('error', `Up to 3 Beasts allowed (you have ${byType.Beast}).`);
  const origin = f.origins[wb.origin];
  if (origin) { const ld = wb.fighters.find(x => fdef(f, x.fid).type === 'Leader'); if (ld && ld.fid !== origin.leader) push('error', `${origin.name} must be led by a ${fdef(f, origin.leader).name}.`, ld); }
  f.fighters.forEach(d => { const lim = fighterLimit(f, wb, d); if (!lim) return; const n = wb.fighters.filter(x => x.fid === d.id).length; if (n > lim) push('error', `${d.name}: limit 0-${lim}, you have ${n}.`); });
  // Rare wargear across the warband
  const rareCount = {};
  wb.fighters.forEach(x => { const d = fdef(f, x.fid); const fixed = new Set(d.fixed || []); new Set(SLOTS.map(([k]) => x.gear[k]).filter(Boolean)).forEach(id => { if (fixed.has(id)) return; const it = f.items[id]; if (rareOf(it)) rareCount[id] = (rareCount[id] || 0) + 1; }); });
  Object.entries(rareCount).forEach(([id, n]) => { const it = f.items[id]; if (n > rareOf(it)) push('error', `${it.name} is Rare 0-${rareOf(it)}: ${n} fighters have one.`); });
  // Skills: no duplicates
  const skillOwners = {};
  wb.fighters.forEach(x => { const d = fdef(f, x.fid); [...(d.freeSkills || []), ...x.skills].forEach(s => (skillOwners[s] = skillOwners[s] || []).push(x)); });
  Object.entries(skillOwners).forEach(([s, xs]) => { if (xs.length > 1) push('error', `Skill "${s}" is on ${xs.length} fighters. Each skill can only be on one fighter.`, xs[1]); });
  // Per fighter
  wb.fighters.forEach(x => {
    const d = fdef(f, x.fid); const its = gearItems(f, x); const nm = displayName(f, x);
    const th = its.filter(isTwoHanded);
    if (th.length > 1) push('error', `${nm}: only 1 two-handed weapon allowed.`, x);
    const held = its.filter(i => i.cat === 'item' && i.held);
    const thR = its.filter(i => i.cat === 'ranged' && isTwoHanded(i));
    if (held.length && thR.length) push('error', `${nm}: cannot carry a held item (${held[0].name}) with a two-handed ranged weapon.`, x);
    if (its.some(i => i.id === 'full_plate') && thR.some(i => !i.plateOk)) push('error', `${nm}: Full-plate cannot be worn with a two-handed ranged weapon (except a Brace of Pistols).`, x);
    its.forEach(i => { if (i.requires && !its.some(j => j.id === i.requires)) push('error', `${nm}: ${i.name} needs a ${f.items[i.requires].name}.`, x); });
    const dupItem = SLOTS.map(([k]) => x.gear[k]).filter(Boolean); const seen = new Set();
    dupItem.forEach(id => { const it = f.items[id]; if (seen.has(id) && it.cat === 'item') push('warn', `${nm}: carries two ${it.name}s.`, x); seen.add(id); });
    if (d.skills && x.skills.length < d.skills) push('warn', `${nm}: pick ${d.skills - x.skills.length} more skill${d.skills - x.skills.length > 1 ? 's' : ''}.`, x);
    if (d.sig && x.spells.length < d.sig) push('warn', `${nm}: pick ${d.sig - x.spells.length} more signature spell${d.sig - x.spells.length > 1 ? 's' : ''}.`, x);
  });
  return { list: out, per, errors: out.filter(i => i.level === 'error').length };
}

// ---------- Rendering ----------
const app = document.getElementById('app');
function render() {
  const active = document.activeElement && document.activeElement.id; const sy = window.scrollY;
  const wb = WB(); const f = fac(wb.faction); const t = totals(wb); const chk = check(wb);
  app.innerHTML = `
  <header class="bar"><div class="wrap">
    <div class="brand">Black Death City<small>${esc(wb.name || 'Unnamed warband')} · ${esc(f.name)}</small></div>
    <div class="tally">
      <div class="tal ${t.left < 0 ? 'bad' : ''}"><b>${t.left}</b><span><span class="lg">Silver left</span><span class="sm">Silver</span></span></div>
      <div class="tal"><b>${t.cost}</b><span>Spent</span></div>
      <div class="tal"><b>${t.rating}</b><span>Rating</span></div>
      <div class="tal ${t.count > MAX_FIGHTERS ? 'bad' : ''}"><b>${t.count}/${MAX_FIGHTERS}</b><span>Fighters</span></div>
    </div>
    <button class="status ${chk.errors ? 'no' : chk.list.length ? 'todo' : 'ok'}" id="status-btn" data-act="issues">${chk.errors ? `${chk.errors} to fix` : chk.list.length ? `${chk.list.length} to do` : '<span class="lg">Legal warband</span><span class="sm">Legal</span>'}</button>
  </div>
  </header>
  <nav class="wrap"><div class="tabs" role="tablist">
    ${[['build', 'Build', 'Build'], ['sheet', 'Roster sheet', 'Roster'], ['cheat', 'Cheat sheet', 'Cheat sheet'], ['bands', 'My warbands', 'Warbands']].map(([k, l, sh]) => `<button class="tab" role="tab" id="tab-${k}" aria-selected="${ui.tab === k}" data-act="tab" data-v="${k}"><span class="lg">${l}</span><span class="sm">${sh}</span></button>`).join('')}
  </div></nav>
  <main class="wrap">${ui.tab === 'build' ? viewBuild(wb, f, chk) : ui.tab === 'sheet' ? viewSheet(wb, f, chk) : ui.tab === 'cheat' ? viewCheat() : viewBands()}</main>`;
  const bar = app.querySelector('.bar'); if (bar) document.documentElement.style.setProperty('--barh', bar.offsetHeight + 'px');
  if (active) { const el = document.getElementById(active); if (el) el.focus({ preventScroll: true }); }
  window.scrollTo(0, sy);
}

function issuesBlock(chk, f, wb) {
  if (!chk.list.length) return `<div class="allgood">Warband is legal and ready to play.</div>`;
  return `<ul class="issues">${chk.list.map(i => `<li class="issue ${i.level}"><span class="tag">${i.level === 'error' ? 'Fix' : 'To do'}</span>${i.uid ? `<button data-act="sel" data-v="${i.uid}">${esc(i.msg)}</button>` : `<span>${esc(i.msg)}</span>`}</li>`).join('')}</ul>`;
}

function viewBuild(wb, f, chk) {
  const o = f.origins[wb.origin];
  const banner = wb.example ? `<div class="banner"><span>This is an example warband so you can see how it works.</span><button class="btn small" data-act="tab" data-v="bands">Start your own</button></div>` : '';
  const groups = TYPES.map(ty => {
    const xs = wb.fighters.filter(x => fdef(f, x.fid).type === ty.key);
    const counted = xs.filter(x => countsAs(f, wb, fdef(f, x.fid))).length;
    const lim = ty.key === 'Henchman' ? `${counted} · need 5+` : `${counted}/${ty.max}`;
    const bad = (ty.max && counted > ty.max) || (ty.key === 'Henchman' && counted < 5) || (ty.key === 'Leader' && counted !== 1);
    return `<section class="group"><h3>${ty.plural}<span class="cnt ${bad ? 'bad' : ''}">${lim}</span></h3>
      ${xs.length ? `<ul class="fl">${xs.map(x => { const d = fdef(f, x.fid); const iss = chk.per[x.uid]; const gear = gearItems(f, x).map(i => i.name).join(', ');
        return `<li><button class="fbtn" id="f-${x.uid}" data-act="sel" data-v="${x.uid}" aria-current="${ui.sel === x.uid && !ui.recruit}">
          <span class="nm">${iss ? '<span class="flag" title="Needs attention">! </span>' : ''}${esc(displayName(f, x))}</span>
          <span class="sub">${x.name.trim() ? esc(d.name) + ' · ' : ''}${esc(gear || (d.natural ? 'Natural weapons' : 'No wargear'))}</span>
          <span class="cost">${fighterCost(f, x)}s</span></button></li>`; }).join('')}</ul>` : `<div class="empty">None recruited</div>`}
    </section>`;
  }).join('');
  const sel = wb.fighters.find(x => x.uid === ui.sel);
  const detail = ui.recruit || !sel ? viewRecruit(wb, f) : viewFighter(wb, f, sel, chk);
  return `<div class="grid ${ui.detail ? 'detail-open' : ''}">
    <div class="col-roster stack">
      ${banner}
      <div class="panel stack">
        <div><label class="lbl" for="wb-name">Warband name</label><input type="text" id="wb-name" value="${esc(wb.name)}" data-act="wbname"></div>
        <div><label class="lbl" for="wb-origin">Origin (${esc(f.name)})</label>
          <select id="wb-origin" data-act="origin">${f.origins.map((or, i) => `<option value="${i}" ${i === wb.origin ? 'selected' : ''}>${esc(or.name)}, led by ${esc(fdef(f, or.leader).name)}</option>`).join('')}</select></div>
        ${o ? `<div class="hint"><b>Stronghold: ${esc(o.stronghold)}.</b> ${esc(o.hold)}${o.perks.length ? `<br><b>${esc(o.perks.join(' '))}</b>` : ''}</div>` : ''}
      </div>
      ${ui.showIssues || chk.list.length ? `<div class="panel stack"><h3 style="font-family:var(--f-display);font-weight:400;font-size:1.45rem">Rules check</h3>${issuesBlock(chk, f, wb)}</div>` : ''}
      <button class="btn primary" id="recruit-btn" data-act="recruit">+ Recruit a fighter</button>
      <div class="panel stack">${groups}</div>
    </div>
    <div class="col-detail">${detail}</div>
  </div>`;
}

function statRow(s, mod) {
  const cols = [['mv', 'Move'], ['bl', 'Blade'], ['bw', 'Bow'], ['ar', 'Armour'], ['ini', 'Init.'], ['wp', 'Will'], ['li', 'Life']];
  const fmt = (k, v) => v === '-' ? '-' : k === 'mv' ? (typeof v === 'number' ? v + '"' : v + '"') : (k === 'bl' || k === 'bw' || k === 'ar') ? v + '+' : v;
  return `<div class="stats-wrap"><table class="stats"><thead><tr>${cols.map(c => `<th scope="col">${c[1]}</th>`).join('')}</tr></thead><tbody><tr>${cols.map(([k]) => `<td class="${mod[k] ? 'mod' : ''}">${fmt(k, s[k])}</td>`).join('')}</tr></tbody></table></div>`;
}
function traitChips(traits) { return traits.length ? traits.map(t => `<span class="trait" title="${esc(TRAIT_TIPS[t.replace(/ 0-\d+/, '')] || (t.startsWith('Rare') ? 'Limited across the warband' : ''))}">${esc(t)}</span>`).join('') : '-'; }
function weaponTable(ws, heldWith2H) {
  if (!ws.length) return '';
  return `<div class="tbl-wrap"><table class="wp"><thead><tr><th>Weapon</th><th>Rng</th><th>Att</th><th>Rend</th><th>Dmg</th><th>Crit</th><th>Traits</th></tr></thead><tbody>
    ${ws.map(w => { const a = heldWith2H && w.cat === 'melee' && isTwoHanded(w) && typeof w.a === 'number' ? `${w.a - 1}*` : w.a;
      return `<tr><td><b>${esc(w.name)}</b></td><td class="n">${w.cat === 'ranged' ? esc(w.rng) : '-'}</td><td class="n">${a}</td><td class="n">${w.r}</td><td class="n">${w.d}</td><td class="n">${w.c}</td><td>${traitChips(w.traits)}</td></tr>`; }).join('')}
  </tbody></table></div>${heldWith2H ? '<p class="hint">* Attacks reduced by 1 because a held item is carried with a two-handed melee weapon.</p>' : ''}`;
}

function viewFighter(wb, f, x, chk) {
  const d = fdef(f, x.fid); const { s, mod } = effStats(f, x); const cost = fighterCost(f, x);
  const allowed = allowedItems(f, d); const fixed = new Set(d.fixed || []);
  const its = gearItems(f, x);
  const weapons = [...(d.natural || []).map(id => ({ id, ...f.items[id] })), ...its.filter(i => i.cat === 'melee' || i.cat === 'ranged')];
  const heldWith2H = its.some(i => i.cat === 'item' && i.held) && its.some(i => i.cat === 'melee' && isTwoHanded(i));
  const extras = its.filter(i => i.cat === 'armour' || i.cat === 'item');
  const iss = chk.per[x.uid] || [];
  const slotHtml = d.noGear ? '' : SLOTS.map(([k, label]) => {
    const cur = x.gear[k];
    if (cur && fixed.has(cur) && SLOTS.find(([kk]) => x.gear[kk] === cur)[0] === k) return `<div><span class="lbl">${label}</span><div class="locked">${esc(f.items[cur].name)} (included)</div></div>`;
    const opts = allowed.filter(id => slotAccepts(k, f.items[id]));
    if (!opts.length) return `<div><span class="lbl">${label}</span><div class="locked" style="font-weight:500;color:var(--muted)">Nothing available</div></div>`;
    const cats = [['melee', 'Melee weapons'], ['item', 'Held items'], ['ranged', 'Ranged weapons'], ['armour', 'Armour']];
    const groupsHtml = (k === 'i1' || k === 'i2') ? opts.map(id => `<option value="${id}" ${cur === id ? 'selected' : ''}>${esc(f.items[id].name)} · ${f.items[id].cost}s</option>`).join('')
      : cats.map(([c, cl]) => { const g = opts.filter(id => f.items[id].cat === c); return g.length ? `<optgroup label="${cl}">${g.map(id => `<option value="${id}" ${cur === id ? 'selected' : ''}>${esc(f.items[id].name)} · ${f.items[id].cost}s</option>`).join('')}</optgroup>` : ''; }).join('');
    return `<div><label class="lbl" for="g-${k}">${label}</label><select id="g-${k}" data-act="gear" data-slot="${k}"><option value="">None</option>${groupsHtml}</select></div>`;
  }).join('');
  // Skills
  const takenBy = {}; wb.fighters.forEach(y => { if (y.uid === x.uid) return; const dy = fdef(f, y.fid); [...(dy.freeSkills || []), ...y.skills].forEach(sk => takenBy[sk] = displayName(f, y)); });
  const tables = eligibleTables(f, d);
  const nSkills = d.skills || 0;
  const skillHtml = nSkills ? `<section class="sec panel"><h3>Skills <small>Pick ${nSkills} · ${x.skills.length} chosen</small></h3>
    ${d.freeSkills ? `<p class="note">Already has: <b>${d.freeSkills.join(', ')}</b></p>` : ''}
    <div class="picks">${tables.map(tb => `<div><h4>${esc(tb.name)} <span>(${esc(tb.who)})</span></h4>
      ${tb.skills.filter(sk => !(sk[2] && sk[2].champOnly && d.type !== 'Champion')).map(([n, txt]) => { const on = x.skills.includes(n); const own = (d.freeSkills || []).includes(n); const tk = takenBy[n]; const full = !on && x.skills.length >= nSkills; const dis = own || (!on && (tk || full));
        const id = 'sk-' + n.replace(/\W/g, '');
        return `<label class="opt ${on ? 'on' : ''} ${dis ? 'off' : ''}" for="${id}"><input type="checkbox" id="${id}" data-act="skill" data-v="${esc(n)}" ${on || own ? 'checked' : ''} ${dis ? 'disabled' : ''}><b>${esc(n)}${tk && !on ? ` <span class="hint">· taken by ${esc(tk)}</span>` : ''}${own ? ' <span class="hint">· already known</span>' : ''}</b><span class="t">${esc(txt)}</span></label>`; }).join('')}</div>`).join('')}</div></section>` : '';
  // Spells
  const lore = d.lore ? SPELLS[d.lore] : null;
  const spellHtml = lore ? `<section class="sec panel"><h3>${esc(d.lore)} <small>Pick ${d.sig} signature spell${d.sig > 1 ? 's' : ''} · ${x.spells.length} chosen</small></h3>
    <p class="hint">Signature spells are always known. At the start of each battle this fighter also prepares 1 random spell from the lore.</p>
    <div>${lore.map(sp => { const on = x.spells.includes(sp.name); const dis = !on && x.spells.length >= d.sig; const id = 'sp-' + sp.name.replace(/\W/g, '');
      return `<label class="opt ${on ? 'on' : ''} ${dis ? 'off' : ''}" for="${id}"><input type="checkbox" id="${id}" data-act="spell" data-v="${esc(sp.name)}" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''}><b>${sp.n}. ${esc(sp.name)} <span class="hint">· ${esc(sp.type)} · casting value <span class="cv">${sp.cv}+</span></span></b><span class="t">${esc(sp.text)}</span></label>`; }).join('')}</div></section>` : '';
  // Options
  const optHtml = d.options ? `<section class="sec panel"><h3>${esc(d.options.label)} <small>Optional, pick 1</small></h3>
    ${d.options.list.map(o => { const on = x.opt === o.id; const id = 'op-' + o.id; return `<label class="opt ${on ? 'on' : ''}" for="${id}"><input type="checkbox" id="${id}" data-act="opt" data-v="${o.id}" ${on ? 'checked' : ''}><b>${esc(o.name)} <span class="hint">· +${o.cost}s</span></b><span class="t">${esc(o.text)}</span></label>`; }).join('')}</section>` : '';
  const lists = d.lists.map(l => f.lists[l].name).join(', ');
  const confirming = ui.confirm === x.uid;
  return `<div class="stack">
    <button class="btn back-btn" data-act="back">← Back to roster</button>
    <section class="panel stack">
      <div class="sheet-head">
        <div style="min-width:0;flex:1"><h2>${esc(displayName(f, x))}</h2>
          <div class="kw">${esc(d.name)}${d.max ? ` (0-${fighterLimit(f, wb, d) || '∞'})` : ''} · ${esc(d.kw)}${x.opt && d.options.list.find(o => o.id === x.opt).kw ? ', ' + d.options.list.find(o => o.id === x.opt).kw : ''}</div></div>
        <div class="price"><b>${cost}s</b><span>${d.cost}s base${cost !== d.cost ? ` + ${cost - d.cost}s gear` : ''}</span></div>
      </div>
      <div><label class="lbl" for="f-name">Fighter name</label><input type="text" id="f-name" value="${esc(x.name)}" placeholder="${esc(d.name)}" data-act="fname"></div>
      ${statRow(s, mod)}
      ${Object.keys(mod).length ? '<p class="hint">Highlighted values include wargear or mutations.</p>' : ''}
      ${iss.length ? `<ul class="issues">${iss.map(i => `<li class="issue ${i.level}"><span class="tag">${i.level === 'error' ? 'Fix' : 'To do'}</span><span>${esc(i.msg)}</span></li>`).join('')}</ul>` : ''}
    </section>
    <section class="sec panel"><h3>Wargear <small>${d.noGear ? 'Cannot take other wargear' : 'From the ' + esc(lists) + ' (' + esc(f.armoury) + ')'}</small></h3>
      ${d.noGear ? '' : `<p class="hint" style="margin-top:0">Up to 2 melee weapons (held items like shields use a melee slot), 1 ranged weapon, 1 armour and 2 items. Only 1 two-handed weapon.</p><div class="slots">${slotHtml}</div>`}
      ${d.noGear && (d.fixed || []).length ? `<div class="locked">${(d.fixed || []).map(id => esc(f.items[id].name)).join(', ')} (included)</div>` : ''}
      ${weapons.length ? `<div style="margin-top:14px">${weaponTable(weapons, heldWith2H)}</div>` : ''}
      ${extras.length ? `<ul class="rules" style="margin-top:12px">${extras.map(i => `<li><b>${esc(i.name)}${i.cat === 'armour' ? ` (Armour ${i.sv}+)` : i.held ? ' (Held item)' : ''}${rareOf(i) ? ` · Rare 0-${rareOf(i)}` : ''}.</b> ${esc(i.text)}</li>`).join('')}</ul>` : ''}
    </section>
    ${optHtml}${skillHtml}${spellHtml}
    ${d.rules && d.rules.length ? `<section class="sec panel"><h3>Special rules</h3><ul class="rules">${d.rules.map(r => `<li><b>${esc(r.name)}:</b> ${esc(r.text)}</li>`).join('')}</ul>
      ${d.alt ? `<div style="margin-top:12px"><span class="lbl">${esc(d.alt.name)} profile</span>${statRow(d.alt.s, {})}${weaponTable(d.alt.natural.map(id => ({ id, ...f.items[id] })), false)}</div>` : ''}</section>` : ''}
    <section class="sec panel"><h3>Starting experience <small>${d.xp[1] ? `${d.xp[0] ? d.xp[0] + ' + ' : ''}d6` : 'Fixed'}</small></h3>
      <div class="xp">${d.xp[1] ? `<span>${d.xp[0]} +</span><label class="lbl" for="xp-roll" style="margin:0">d6 roll</label><input type="number" id="xp-roll" min="1" max="6" value="${x.xpRoll}" data-act="xp"><button class="btn small" data-act="reroll">Roll again</button>` : ''}
      <span>Total</span><span class="tot">${fighterXp(x)} XP</span></div>
      <p class="hint">Experience counts towards your warband rating, not your silver.</p></section>
    <section class="panel row">
      <button class="btn" data-act="dup">Duplicate fighter</button>
      ${confirming ? `<span class="confirm">Remove ${esc(displayName(f, x))}? <button class="btn small danger" data-act="del-yes">Remove</button><button class="btn small" data-act="del-no">Keep</button></span>` : `<button class="btn danger" data-act="del">Remove fighter</button>`}
    </section>
  </div>`;
}

function viewRecruit(wb, f) {
  const t = totals(wb);
  return `<div class="stack"><button class="btn back-btn" data-act="back">← Back to roster</button>
  <section class="panel stack"><div class="sheet-head"><div><h2 style="font-family:var(--f-display);font-weight:400;font-size:2.1rem">Recruit a fighter</h2><div class="kw">${esc(f.name)} · ${t.left} silver left · ${t.count}/${MAX_FIGHTERS} fighters</div></div></div>
  ${TYPES.map(ty => { const ds = f.fighters.filter(d => d.type === ty.key); if (!ds.length) return '';
    const n = wb.fighters.filter(x => { const d = fdef(f, x.fid); return countsAs(f, wb, d) === ty.key; }).length;
    return `<div class="rec-group"><h3>${ty.plural} <span class="hint" style="font-family:var(--f-body);font-size:1rem">${ty.key === 'Henchman' ? 'at least 5' : 'up to ' + ty.max} · you have ${n}</span></h3>
    ${ds.map(d => { const lim = fighterLimit(f, wb, d); const have = wb.fighters.filter(x => x.fid === d.id).length; const typeFull = ty.max && n >= ty.max && countsAs(f, wb, d);
      let why = ''; if (lim && have >= lim) why = `Limit reached (0-${lim}).`; else if (typeFull) why = `${ty.plural} full (${ty.max}).`; else if (t.count >= MAX_FIGHTERS) why = 'Warband is at 15 fighters.';
      const poor = !why && d.cost > t.left ? `Costs more than your remaining ${t.left} silver.` : '';
      const o = f.origins[wb.origin]; const wrongLeader = ty.key === 'Leader' && o && o.leader !== d.id ? `${o.name} must be led by a ${fdef(f, o.leader).name}.` : '';
      return `<div class="rec"><span class="nm">${esc(d.name)}${lim ? ` <span class="hint">0-${lim}</span>` : ''}</span>
        <span class="sub">M ${d.s.mv}${typeof d.s.mv === 'number' ? '"' : '"'} · Blade ${d.s.bl}+ · Bow ${d.s.bw}${d.s.bw === '-' ? '' : '+'} · Life ${d.s.li}${d.lore ? ' · ' + esc(d.lore) : ''}${d.skills ? ` · ${d.skills} skill${d.skills > 1 ? 's' : ''}` : ''}</span>
        <span class="c">${d.cost}s</span><button class="btn small ${why ? '' : 'primary'}" data-act="add" data-v="${d.id}" ${why ? 'disabled' : ''} aria-label="Recruit ${esc(d.name)}">Add</button>
        ${why || poor || wrongLeader ? `<span class="why">${esc(why || wrongLeader || poor)}</span>` : ''}</div>`; }).join('')}</div>`; }).join('')}
  </section></div>`;
}

function rosterText(wb, f) {
  const t = totals(wb); const o = f.origins[wb.origin];
  const lines = [`${wb.name || 'Unnamed warband'}`, `${f.name} · ${o ? o.name : ''} · Stronghold: ${o ? o.stronghold : ''}`, `Spent ${t.cost}s · Stash ${Math.max(0, t.left)}s · Warband rating ${t.rating}`, ''];
  wb.fighters.forEach(x => { const d = fdef(f, x.fid); const { s } = effStats(f, x);
    lines.push(`${displayName(f, x)} (${d.name}, ${d.type}) ${fighterCost(f, x)}s, ${fighterXp(x)} XP`);
    lines.push(`  M ${s.mv}" Bl ${s.bl}+ Bw ${s.bw}${s.bw === '-' ? '' : '+'} Ar ${s.ar}+ In ${s.ini} Wp ${s.wp} Li ${s.li}`);
    const g = [...(d.natural || []).map(id => f.items[id].name), ...gearItems(f, x).map(i => i.name)]; if (g.length) lines.push(`  Wargear: ${g.join(', ')}`);
    const sk = [...(d.freeSkills || []), ...x.skills]; if (sk.length) lines.push(`  Skills: ${sk.join(', ')}`);
    if (x.spells.length) lines.push(`  Signature spells: ${x.spells.join(', ')}`);
    if (x.opt) lines.push(`  Mutation: ${d.options.list.find(o => o.id === x.opt).name}`);
  });
  return lines.join('\n');
}
function viewSheet(wb, f, chk) {
  const t = totals(wb); const o = f.origins[wb.origin];
  const order = TYPES.map(ty => ty.key);
  const xs = [...wb.fighters].sort((a, b) => order.indexOf(fdef(f, a.fid).type) - order.indexOf(fdef(f, b.fid).type));
  return `<div class="stack">
    <section class="panel stack"><div class="sheet-head"><div><h2 style="font-family:var(--f-display);font-weight:400;font-size:2.2rem">${esc(wb.name || 'Unnamed warband')}</h2>
      <div class="kw">${esc(f.name)} · ${esc(o ? o.name : '')} · Stronghold: ${esc(o ? o.stronghold : '')}</div></div>
      <div class="price"><b>${t.rating}</b><span>Warband rating · ${t.cost}s spent · stash ${Math.max(0, t.left)}s</span></div></div>
      ${chk.list.length ? `<div class="issue error"><span class="tag">Fix</span><span>${chk.list.length} item${chk.list.length > 1 ? 's' : ''} still to sort out. See the Build tab.</span></div>` : ''}
      <div class="row"><button class="btn primary" id="pdf-roster" data-act="pdf-roster">Download roster PDF</button>
        <label class="row" for="pdf-cheat-inc" style="gap:8px;cursor:pointer"><input type="checkbox" id="pdf-cheat-inc" data-act="cheatinc" ${ui.cheatInc !== false ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--accent)">Add the battle cheat sheet</label></div>
      ${noDlNote()}
      <p class="hint" style="margin:0">The PDF has every fighter's profile with the full rules for their wargear, skills, spells and special rules.</p>
      <div class="row"><button class="btn" data-act="copytext">Copy roster as text</button><span class="hint">Paste it into a message or your campaign notes.</span></div></section>
    <div class="sheet-grid">${xs.map(x => { const d = fdef(f, x.fid); const { s } = effStats(f, x);
      const g = [...(d.natural || []).map(id => f.items[id].name), ...gearItems(f, x).map(i => i.name)];
      const sk = [...(d.freeSkills || []), ...x.skills];
      const cell = (l, v) => `<div><small>${l}</small><b>${v}</b></div>`;
      return `<article class="card"><h3>${esc(displayName(f, x))}<span>${fighterCost(f, x)}s</span></h3><div class="kw">${esc(d.name)} · ${esc(d.type)} · ${fighterXp(x)} XP</div>
        <div class="mini">${cell('Move', s.mv + '"')}${cell('Blade', s.bl + '+')}${cell('Bow', s.bw === '-' ? '-' : s.bw + '+')}${cell('Armour', s.ar + '+')}${cell('Init', s.ini)}${cell('Will', s.wp)}${cell('Life', s.li)}</div>
        <dl><dt>Wargear</dt><dd>${esc(g.join(', ') || 'None')}</dd>${sk.length ? `<dt>Skills</dt><dd>${esc(sk.join(', '))}</dd>` : ''}${x.spells.length ? `<dt>Spells</dt><dd>${esc(x.spells.join(', '))}</dd>` : ''}${x.opt ? `<dt>Mutation</dt><dd>${esc(d.options.list.find(o => o.id === x.opt).name)}</dd>` : ''}</dl></article>`; }).join('')}</div>
  </div>`;
}

function viewBands() {
  const nw = ui.newWb;
  const list = `<section class="panel stack"><h2 style="font-family:var(--f-display);font-weight:400;font-size:2rem">My warbands</h2>
    <p class="hint" style="margin:0">Warbands are saved in this browser only. Use "Copy warband code" to back one up or move it to another device.</p>
    <ul class="wblist">${S.warbands.map(w => { const f = fac(w.faction); const t = totals(w); const cur = w.id === S.current;
      return `<li class="wbitem ${cur ? 'cur' : ''}"><div><b>${esc(w.name || 'Unnamed warband')}</b>${w.example ? ' <span class="hint">(example)</span>' : ''}<div class="hint">${esc(f.name)} · ${w.fighters.length} fighters · rating ${t.rating}</div></div>
        <div class="row">${cur ? '<span class="hint">Open</span>' : `<button class="btn small primary" data-act="open" data-v="${w.id}">Open</button>`}
        <button class="btn small" data-act="export" data-v="${w.id}">Copy warband code</button>
        ${ui.confirm === 'wb-' + w.id ? `<span class="confirm">Delete for good? <button class="btn small danger" data-act="wbdel-yes" data-v="${w.id}">Delete</button><button class="btn small" data-act="del-no">Keep</button></span>` : `<button class="btn small danger" data-act="wbdel" data-v="${w.id}" ${S.warbands.length < 2 ? 'disabled title="Keep at least one warband"' : ''}>Delete</button>`}</div></li>`; }).join('')}</ul></section>`;
  const create = `<section class="panel stack"><h2 style="font-family:var(--f-display);font-weight:400;font-size:2rem">New warband</h2>
    <div><label class="lbl" for="nw-name">Name</label><input type="text" id="nw-name" value="${esc(nw.name)}" data-act="nwname" placeholder="e.g. The Gallows Crows"></div>
    <div><span class="lbl">1. Pick a faction</span><div class="choices">${FACTIONS.map(f => `<button class="choice" id="nf-${f.id}" data-act="nwfac" data-v="${f.id}" aria-pressed="${nw.faction === f.id}"><b>${esc(f.name)}</b><span>${esc(f.blurb)}</span></button>`).join('')}</div></div>
    ${nw.faction ? `<div><span class="lbl">2. Pick an origin</span><div class="choices">${fac(nw.faction).origins.map((o, i) => `<button class="choice" id="no-${i}" data-act="nworg" data-v="${i}" aria-pressed="${nw.origin === i}"><b>${esc(o.name)}</b><span>Leader: ${esc(fdef(fac(nw.faction), o.leader).name)} · Stronghold: ${esc(o.stronghold)}${o.perks.length ? '. ' + esc(o.perks.join(' ')) : ''}</span></button>`).join('')}</div></div>` : ''}
    <div class="row"><button class="btn primary" id="nw-create" data-act="create" ${nw.faction && nw.origin !== null ? '' : 'disabled'}>Create warband</button><span class="hint">Your origin's leader is added for you.</span></div></section>`;
  const imp = `<section class="panel stack"><h2 style="font-family:var(--f-display);font-weight:400;font-size:2rem">Import a warband</h2>
    <label class="lbl" for="imp">Paste a warband code</label><textarea id="imp" data-act="imptext">${esc(ui.importText)}</textarea>
    <div class="row"><button class="btn" id="imp-btn" data-act="import">Import</button>${ui.importErr ? `<span class="issue error">${esc(ui.importErr)}</span>` : ''}</div></section>`;
  const share = `<section class="panel stack"><h2 style="font-family:var(--f-display);font-weight:400;font-size:2rem">Share with your group</h2>
    <p class="hint" style="margin:0">Send players this link so they can build their own warbands. Each player's warbands stay in their own browser. To share a finished warband, use <b>Copy warband code</b> below and have them paste it under <b>Import a warband</b>.</p>
    <div class="sharelink" id="share-url">${esc(SHARE_URL)}</div>
    <div class="row"><button class="btn primary" id="share-copy" data-act="sharelink">Copy link</button><button class="btn" id="share-invite" data-act="shareinvite">Copy invite message</button></div></section>`;
  return `<div class="stack">${share}${create}${list}${imp}</div>`;
}

// ---------- Events ----------
function toast(msg) { document.querySelectorAll('.toast').forEach(n => n.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
async function copy(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) { ui.importText = text; ui.tab = 'bands'; render(); const ta = document.getElementById('imp'); if (ta) { ta.focus(); ta.select(); } toast('Copy blocked here. The text is selected below, copy it yourself.'); }
}
const commit = () => { const wb = WB(); if (wb.example) wb.example = false; save(); render(); };
const softCommit = () => { save(); render(); };

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT' || b.tagName === 'TEXTAREA') return;
  const a = b.dataset.act, v = b.dataset.v; const wb = WB(); const f = fac(wb.faction);
  const x = wb.fighters.find(y => y.uid === ui.sel);
  switch (a) {
    case 'tab': ui.tab = v; ui.confirm = null; if (v === 'bands' && !ui.newWb) ui.newWb = { name: '', faction: null, origin: null }; render(); window.scrollTo(0, 0); break;
    case 'issues': ui.tab = 'build'; ui.showIssues = true; ui.detail = false; render(); break;
    case 'sel': ui.sel = v; ui.recruit = false; ui.detail = true; ui.confirm = null; ui.tab = 'build'; render(); if (window.innerWidth <= 880) window.scrollTo(0, 0); break;
    case 'recruit': ui.recruit = true; ui.detail = true; render(); if (window.innerWidth <= 880) window.scrollTo(0, 0); break;
    case 'back': ui.detail = false; ui.recruit = false; render(); break;
    case 'add': { const nx = makeFighter(f, v, wb); wb.fighters.push(nx); ui.sel = nx.uid; ui.recruit = false; ui.detail = true; commit(); toast(`${fdef(f, v).name} recruited`); if (window.innerWidth <= 880) window.scrollTo(0, 0); break; }
    case 'dup': { const c = JSON.parse(JSON.stringify(x)); c.uid = uid(); c.skills = []; c.name = c.name ? c.name + ' II' : ''; wb.fighters.splice(wb.fighters.indexOf(x) + 1, 0, c); ui.sel = c.uid; commit(); toast('Fighter duplicated. Skills were cleared, since each skill can only be on one fighter.'); break; }
    case 'del': ui.confirm = x.uid; render(); break;
    case 'del-no': ui.confirm = null; render(); break;
    case 'del-yes': wb.fighters = wb.fighters.filter(y => y.uid !== x.uid); ui.sel = null; ui.confirm = null; ui.detail = false; commit(); toast('Fighter removed'); break;
    case 'reroll': x.xpRoll = d6(); commit(); break;
    case 'copytext': copy(rosterText(wb, f), 'Roster copied'); break;
    case 'sharelink': copy(SHARE_URL, 'Link copied'); break;
    case 'shareinvite': copy(`Join the Black Death City campaign! Build your warband here: ${SHARE_URL}\n\nPick your faction and origin under My warbands, recruit your fighters on the Build tab, and fix anything the rules check flags. When you're done, go to My warbands, tap "Copy warband code" and send it to me so I can import it. The Cheat sheet tab has deployment, turns and actions for game night.`, 'Invite message copied'); break;
    case 'pdf-roster': exportRosterPdf(ui.cheatInc !== false); break;
    case 'pdf-cheat': exportCheatPdf(); break;
    case 'open': S.current = v; ui.sel = null; ui.tab = 'build'; ui.detail = false; save(); render(); break;
    case 'export': { const w = S.warbands.find(w => w.id === v); copy(btoa(unescape(encodeURIComponent(JSON.stringify(w)))), 'Warband code copied'); break; }
    case 'wbdel': ui.confirm = 'wb-' + v; render(); break;
    case 'wbdel-yes': S.warbands = S.warbands.filter(w => w.id !== v); if (S.current === v) S.current = S.warbands[0].id; ui.confirm = null; save(); render(); break;
    case 'nwfac': ui.newWb.faction = v; ui.newWb.origin = null; render(); break;
    case 'nworg': ui.newWb.origin = +v; render(); break;
    case 'create': { const nf = fac(ui.newWb.faction); const w = { id: uid(), name: ui.newWb.name.trim() || 'New warband', faction: nf.id, origin: ui.newWb.origin, fighters: [] };
      const ld = makeFighter(nf, nf.origins[w.origin].leader, w); w.fighters.push(ld); S.warbands.push(w); S.current = w.id; ui.newWb = { name: '', faction: null, origin: null }; ui.tab = 'build'; ui.sel = ld.uid; ui.detail = true; save(); render(); window.scrollTo(0, 0); toast('Warband created'); break; }
    case 'import': try { const w = JSON.parse(decodeURIComponent(escape(atob(ui.importText.trim())))); if (!w.faction || !fac(w.faction) || !Array.isArray(w.fighters)) throw 0; w.id = uid(); w.example = false; S.warbands.push(w); S.current = w.id; ui.importText = ''; ui.importErr = ''; ui.tab = 'build'; save(); render(); toast('Warband imported'); } catch (err) { ui.importErr = "That code wasn't recognised. Copy the whole code and try again."; render(); } break;
  }
});
app.addEventListener('change', e => {
  const el = e.target; const a = el.dataset.act; if (!a) return; const wb = WB(); const f = fac(wb.faction); const x = wb.fighters.find(y => y.uid === ui.sel);
  if (a === 'gear') { x.gear[el.dataset.slot] = el.value || null; commit(); }
  else if (a === 'origin') { wb.origin = +el.value; commit(); }
  else if (a === 'skill') { const n = el.dataset.v; x.skills = el.checked ? [...x.skills, n] : x.skills.filter(s => s !== n); commit(); }
  else if (a === 'spell') { const n = el.dataset.v; x.spells = el.checked ? [...x.spells, n] : x.spells.filter(s => s !== n); commit(); }
  else if (a === 'opt') { x.opt = el.checked ? el.dataset.v : null; commit(); }
  else if (a === 'xp') { x.xpRoll = Math.max(0, Math.min(6, parseInt(el.value) || 0)); commit(); }
  else if (a === 'wbname' || a === 'fname') { commit(); }
  else if (a === 'cheatinc') { ui.cheatInc = el.checked; }
});
app.addEventListener('input', e => {
  const el = e.target; const a = el.dataset.act; const wb = WB(); const f = fac(wb.faction);
  if (a === 'wbname') { wb.name = el.value; save(); const sm = app.querySelector('.brand small'); if (sm) sm.textContent = `${wb.name || 'Unnamed warband'} · ${f.name}`; }
  else if (a === 'fname') { const x = wb.fighters.find(y => y.uid === ui.sel); x.name = el.value; save(); const nm = app.querySelector(`#f-${x.uid} .nm`); if (nm) nm.textContent = displayName(f, x); const h = app.querySelector('.sheet-head h2'); if (h) h.textContent = displayName(f, x); }
  else if (a === 'nwname') ui.newWb.name = el.value;
  else if (a === 'imptext') ui.importText = el.value;
});

// Open on the leader of the current warband so the first view shows a filled sheet.
(() => { const wb = WB(); if (wb.fighters[0]) ui.sel = wb.fighters[0].uid; ui.newWb = { name: '', faction: null, origin: null }; render(); })();
</script>
</body></html>
